<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>辞書広場 — 用例収集</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="plaza.css">
</head>
<body data-page="dictionaries">

  <main role="main">
    <div class="page-header">
      <h1 class="page-title">辞書広場</h1>
      <span class="page-title-en">Public Dictionaries</span>
    </div>

    <div class="search-bar">
      <div class="search-input-wrap">
        <input type="search" id="searchInput" class="form-control" placeholder="辞書名・説明で検索…" aria-label="検索">
        <button class="btn btn--primary btn--sm" id="searchBtn">検索</button>
      </div>
      <select id="sortSelect" class="form-control filter-select" aria-label="並び替え">
        <option value="new">新しい順</option>
        <option value="old">古い順</option>
      </select>
    </div>

    <div id="dictsContainer">
      <div class="loading" aria-live="polite">読み込み中</div>
    </div>
    <div id="pagination" class="pagination"></div>
  </main>

  <!-- 辞書詳細モーダル -->
  <div class="modal-overlay" id="dictDetailModal" hidden aria-modal="true" role="dialog">
    <div class="modal modal--card">
      <button class="modal-close" id="dictDetailClose" aria-label="閉じる">×</button>
      <div id="dictDetailContent"></div>
      <div id="dictDetailCards" class="cards-grid" style="margin-top:1rem;"></div>
    </div>
  </div>

  <a href="yorei.html" class="fab-create" aria-label="用例カードを作成する">＋ 用例を採取する</a>
  <footer class="site-footer">用例収集 — Corpus Collector</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="nav.js"></script>
  <script src="card-render.js"></script>
  <script src="dictionaries.js"></script>
</body>
</html>
