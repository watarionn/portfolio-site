<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>画像仕立て室 | Image Studio</title><meta name="description" content="画像を外部へ送信せず、ブラウザ内で拡大・リサイズ・印刷サイズ調整・クロップできる画像ツール。">
<link rel="stylesheet" href="style.css"></head><body>
<header><a href="/">← 個人大辞典</a><p>IMAGE STUDIO / LOCAL-FIRST</p><h1>画像仕立て室</h1><p class="lead">画像をブラウザの中だけで、ちょうどいい寸法に仕立てる。</p></header>
<main>
<section class="drop" id="drop"><input id="file" type="file" accept="image/*"><label for="file"><strong>画像を選ぶ</strong><span>またはここへドロップ</span></label><p id="fileInfo">PNG / JPEG / WebP など</p></section>
<section class="workspace" id="workspace" hidden>
<div class="preview"><canvas id="canvas"></canvas></div>
<form class="controls" onsubmit="return false">
<fieldset><legend>出力方法</legend><label>モード<select id="mode"><option value="scale">倍率で拡大</option><option value="print">mm・DPIで作成</option></select></label>
<div id="scaleFields"><label>倍率 <input id="scale" type="number" min="1" max="8" step=".5" value="2"> ×</label></div>
<div id="printFields" hidden><label>幅 <input id="mmW" type="number" min="1" value="92"> mm</label><label>高さ <input id="mmH" type="number" min="1" value="67"> mm</label><label>DPI <input id="dpi" type="number" min="72" max="600" value="300"></label><label>合わせ方<select id="fit"><option value="cover">Fill / 切り抜く</option><option value="contain">Fit / 全体を入れる</option></select></label></div>
</fieldset>
<fieldset><legend>書き出し</legend><label>形式<select id="format"><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option></select></label><label>品質 <input id="quality" type="range" min=".5" max="1" step=".05" value=".92"></label></fieldset>
<div class="facts"><span id="sourceSize"></span><strong id="outputSize"></strong></div>
<button id="download" type="button">画像を書き出す</button>
</form></section>
<section class="note"><h2>このツールについて</h2><p>Google Colabで使っていた画像拡大・ケース用画像作成処理を、Pythonなしで使えるブラウザツールへ再構成しました。画像データはサーバーへ送信しません。</p></section>
</main><script src="app.js"></script></body></html>
