[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "mkpdf-safe"
version = "1.0.0"
description = "Local-first safe archive-to-PDF desktop studio"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=12,<13",
  "tkinterdnd2==0.6.3",
]

[project.scripts]
mkpdf-safe = "mkpdf_safe.cli:main"
mkpdf-studio = "mkpdf_safe.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mkpdf_safe = ["assets/*.png"]
