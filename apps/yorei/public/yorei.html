<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用例を採取する — 用例収集</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="yorei.css">
</head>
<body data-page="index">

  <main role="main">

    <div class="create-layout">

      <!-- 左：用例カード作成フォーム -->
      <section class="form-section" aria-labelledby="form-heading">
        <div class="page-header">
          <h1 class="page-title" id="form-heading">用例を採取する</h1>
          <span class="page-title-en">Collect an Example</span>
        </div>

        <div id="form-msg"></div>

        <form id="cardForm" novalidate>

          <!-- 見出し語 -->
          <div class="form-group">
            <label class="form-label" for="headword">
              見出し語
              <span class="form-required">（必須）</span>
            </label>
            <input type="text" id="headword" class="form-control" placeholder="例：辞書、さばく、片鱗" required autocomplete="off">
            <span class="form-hint">調査対象の単語・表現を入力してください</span>
          </div>

          <!-- 役割（品詞など） -->
          <div class="form-group">
            <label class="form-label" for="role">役割</label>
            <input type="text" id="role" class="form-control" placeholder="例：名詞、動詞、形容詞、慣用句">
          </div>

          <!-- 意味 -->
          <div class="form-group">
            <label class="form-label" for="meaning">意味</label>
            <textarea id="meaning" class="form-control" rows="2" placeholder="例：言葉の意味・解釈を記述する。未解明の場合は空白のままでよい。"></textarea>
          </div>

          <!-- 用例 -->
          <div class="form-group">
            <label class="form-label" for="example">
              用例
              <span class="form-required">（必須）</span>
            </label>
            <textarea id="example" class="form-control" rows="5"
              placeholder="該当する言葉が使われている実際の文章・会話を書き写してください。前後の文脈が分かるように長めに記録することを推奨します。" required></textarea>
            <span class="form-hint">見出し語の部分を「《》」で括ると強調表示されます（例：《辞書》を引く）</span>
          </div>

          <!-- 出典 -->
          <div class="section-divider">
            <span class="section-divider-text">出典（書誌情報）</span>
          </div>

          <div class="source-grid">
            <div class="form-group">
              <label class="form-label" for="src-title">書籍名・媒体名</label>
              <input type="text" id="src-title" class="form-control" placeholder="例：夏目漱石全集、朝日新聞">
            </div>
            <div class="form-group">
              <label class="form-label" for="src-author">著者名</label>
              <input type="text" id="src-author" class="form-control" placeholder="例：夏目漱石">
            </div>
            <div class="form-group">
              <label class="form-label" for="src-year">発行年・号数</label>
              <input type="text" id="src-year" class="form-control" placeholder="例：1906年、2024年1月号">
            </div>
            <div class="form-group">
              <label class="form-label" for="src-page">ページ数</label>
              <input type="text" id="src-page" class="form-control" placeholder="例：p.123">
            </div>
            <div class="form-group">
              <label class="form-label" for="src-genre">ジャンル</label>
              <input type="text" id="src-genre" class="form-control" placeholder="例：小説、エッセイ、SNS">
            </div>
            <div class="form-group">
              <label class="form-label" for="src-medium">発行媒体</label>
              <select id="src-medium" class="form-control">
                <option value="">（未選択）</option>
                <option value="書籍">書籍</option>
                <option value="新聞">新聞</option>
                <option value="雑誌">雑誌</option>
                <option value="ウェブ">ウェブ</option>
                <option value="SNS">SNS</option>
                <option value="テレビ・ラジオ">テレビ・ラジオ</option>
                <option value="会話">会話</option>
                <option value="その他">その他</option>
              </select>
            </div>
            <div class="form-group form-group--full">
              <label class="form-label" for="src-isbn">ISBN</label>
              <input type="text" id="src-isbn" class="form-control" placeholder="例：978-4-00-000000-0">
            </div>
          </div>

          <!-- 採取日・採取者 -->
          <div class="section-divider">
            <span class="section-divider-text">採取情報</span>
          </div>

          <div class="source-grid">
            <div class="form-group">
              <label class="form-label" for="collected-at">採取日</label>
              <input type="date" id="collected-at" class="form-control">
            </div>
            <div class="form-group">
              <label class="form-label" for="collector-name">採取者</label>
              <input type="text" id="collector-name" class="form-control" placeholder="採取者名">
            </div>
          </div>

          <!-- 公開設定 -->
          <div class="section-divider">
            <span class="section-divider-text">公開設定</span>
          </div>

          <div class="form-group">
            <div class="toggle-wrap">
              <label class="toggle">
                <input type="checkbox" id="is-public" checked>
                <span class="toggle-track"></span>
              </label>
              <span class="toggle-label" id="public-label">公開（用例広場に表示されます）</span>
            </div>
          </div>

          <!-- 送信 -->
          <div class="form-actions">
            <button type="submit" class="btn btn--vermilion" id="submitBtn">
              <span>用例カードを作成する</span>
            </button>
            <button type="button" class="btn btn--ghost" id="previewBtn">プレビュー</button>
          </div>

        </form>
      </section>

      <!-- 右：プレビュー -->
      <aside class="preview-section" aria-label="プレビュー">
        <div class="preview-label">プレビュー</div>
        <div id="previewCard" class="card preview-card">
          <div class="preview-placeholder">
            <div class="empty-icon">📋</div>
            <p class="empty-text">入力すると<br>ここにプレビューが表示されます</p>
          </div>
        </div>
      </aside>

    </div>

  </main>

  <footer class="site-footer">用例収集 — Corpus Collector</footer>

  <!-- 辞書追加モーダル（保存後に表示） -->
  <div class="modal-overlay" id="dictModal" hidden aria-modal="true" role="dialog" aria-labelledby="dictModalTitle">
    <div class="modal">
      <button class="modal-close" id="dictModalClose" aria-label="閉じる">×</button>
      <h2 class="modal-title" id="dictModalTitle">辞書に追加する</h2>
      <p class="modal-desc">用例カードを保存しました。どの辞書に追加しますか？</p>
      <div id="dictList" class="dict-list"></div>
      <div class="modal-actions">
        <button class="btn btn--ghost btn--sm" id="dictModalSkip">追加しない</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="nav.js"></script>
  <script src="yorei.js"></script>
</body>
</html>
