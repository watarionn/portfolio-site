<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>Prompt Studio 2.0 Beta</title><link rel="stylesheet" href="v2.css"></head><body>
<header><a href="./">← 旧スタジオ</a><h1>Prompt Studio 2.0 <small>プレビュー</small></h1><p>文章からでも、パーツからでも。自由に組み立てる。</p></header>
<main><section class="panel"><h2>1. 文章を作る</h2><p>文章を入力して、変更したい部分を選択。「選択部分をパーツ化」を押してね。</p><label for="source">文章</label><textarea id="source" rows="7" placeholder="例：白いドレスを着た少女が花畑に立っている。"></textarea><div class="actions"><button id="sync" type="button">文章を確定</button><button id="mark" type="button">選択部分をパーツ化</button></div><p class="hint">既存のパーツを含む場合、文章を確定するとパーツを外した自由文章に戻る。誤操作を防ぐため確認するよ。</p><h2>2. パーツを選ぶ</h2><div id="parts"></div><div class="actions"><button id="add" type="button">新しいパーツを追加</button></div></section>
<section class="panel"><h2>3. 完成プレビュー</h2><output id="preview"></output><div class="actions"><button id="copy" type="button">コピー</button><button id="save" type="button">保存</button><button id="export" type="button">JSON書き出し</button><label class="upload">JSON読み込み<input id="import" type="file" accept=".json,application/json"></label></div><div class="actions"><label class="upload">旧PromptDBから読み込む<input id="legacyImport" type="file" accept=".json,application/json"></label></div><p id="status" role="status" aria-live="polite"></p><p class="hint">このプレビューは独立したv2作業データを使用する。旧PromptDBには書き込まない。</p></section></main>
<script src="template-model.js"></script><script src="legacy-adapter.js"></script><script src="v2-beta.js"></script></body></html>
