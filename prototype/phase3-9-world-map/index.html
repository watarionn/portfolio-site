<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio City Phase 3.9 D5E</title><link rel="stylesheet" href="./prototype.css"></head><body>
<main class="prototype-shell"><header class="prototype-header"><p class="eyebrow">Phase 3.9 / CP-D5E</p><h1>Published World View</h1><p>巨大なMaster Worldの一角を探索し、地区から作品へ入る隔離プロトタイプ。</p></header>
<section id="world-panel"><section class="viewport" tabindex="0" aria-label="Portfolio City published world. Drag or use arrow keys to pan."><div class="world" id="world">
<div class="terrain-stage" id="terrain-stage" aria-hidden="true"><div class="world-art terrain-fallback"></div></div>
<button class="district archive" data-district="archive" aria-label="Archive Street"><span class="district-emblem" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M13 13h16c4 0 6 2 6 6v17H18c-3 0-5-2-5-5V13Z"/><path d="M18 13v23M20 18h10M20 23h10"/></svg></span><span class="district-label">Archive</span></button>
<button class="district observatory" data-district="observatory" aria-label="Observatory Hill"><span class="district-emblem" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M13 30h22M17 30c0-8 4-13 11-15 5 3 8 8 8 15M24 30v6M17 36h14"/><path d="m35 10 1.4 3.3L40 15l-3.6 1.5L35 20l-1.5-3.5L30 15l3.5-1.7L35 10Z"/></svg></span><span class="district-label">Observatory</span></button>
<button class="district workshop" data-district="workshop" aria-label="Workshop Alley"><span class="district-emblem" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="m15 34 18-18M14 17l17 18M11 13l8 2-5 5-3-7ZM34 31l4 4-5 4-4-5 5-3Z"/></svg></span><span class="district-label">Workshop</span></button>
<button class="district waterside" data-district="waterside" aria-label="Waterside Play"><span class="district-emblem" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M10 28c5-5 9 5 14 0s9 5 14 0M10 34c5-5 9 5 14 0s9 5 14 0M29 13v13M29 15h8v5h-8"/></svg></span><span class="district-label">Waterside</span></button>
<div class="frontier-vignette" aria-hidden="true"></div></div></section></section>
<section class="district-view" id="district-panel" hidden aria-labelledby="district-name"><div class="district-view__toolbar"><button type="button" id="return-world">Return to World</button><div><p class="eyebrow">District View</p><h2 id="district-name" tabindex="-1"></h2><p id="district-role"></p></div></div><div class="building-grid" id="building-grid"></div><nav class="district-nav"><button id="previous-district">← Previous District</button><button id="next-district">Next District →</button></nav><section class="building-preview" id="building-preview" hidden><div class="building-preview__backdrop" data-preview-close></div><article class="building-preview__card" role="dialog" aria-modal="true"><h3 id="preview-title" tabindex="-1"></h3><p id="preview-id"></p><p id="preview-route"></p><div class="building-preview__actions"><button id="close-preview">Back to District</button><button id="open-work">Open Work</button></div></article></section></section>
<aside class="debug"><strong>D5E debug</strong><span>state: <b id="debug-state">World View</b></span><span>selected: <b id="debug-selected">none</b></span><span>camera: <b id="debug-camera"></b></span><span>tiles: <b id="debug-tiles">fallback / manifest not bound</b></span><span>saved: <b id="debug-saved">none</b></span><span>viewport: <b id="debug-viewport"></b></span><span class="debug-actions"><button id="snapshot-camera">Snapshot</button><button id="restore-camera">Restore</button><button id="reset-camera">Reset</button></span></aside></main><script src="./prototype.js"></script></body></html>
